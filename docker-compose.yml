version: "3.8"

services:
  ai-video-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_video_studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # Optional: set HF_TOKEN if you have a private space or extended quotas
      # - HF_TOKEN=your_token_here
    volumes:
      - ./output_videos:/app/output_videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
